<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --secondary: #f472b6;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.8);
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
            background-attachment: fixed;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.8rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin: 2rem 0;
            border: 1px solid var(--glass);
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .video-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .video-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
        }

        .video-card.favorito {
            border: 2px solid #fbbf24;
            box-shadow: 0 15px 30px rgba(251, 191, 36, 0.3);
        }

        .embed-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 15px 15px 0 0;
        }

        .embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-glow {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.6);
            color: white;
        }

        .btn-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-like {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-favorite {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .btn-delete {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }

        .btn-icon:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .stats-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass);
            border-radius: 15px;
        }

        .music-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 30px;
        }

        .music-wave span {
            display: block;
            width: 3px;
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 3px;
            animation: musicWave 1.2s ease-in-out infinite;
        }

        .music-wave span:nth-child(2) { animation-delay: 0.1s; }
        .music-wave span:nth-child(3) { animation-delay: 0.2s; }
        .music-wave span:nth-child(4) { animation-delay: 0.3s; }
        .music-wave span:nth-child(5) { animation-delay: 0.4s; }

        @keyframes musicWave {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .floating-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Nuevos estilos para filtros */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            padding-bottom: 1rem;
        }

        .filter-btn {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary-gradient);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.6);
            color: white;
        }

        .filter-btn:not(.active) {
            background: var(--card-bg);
            border: 1px solid var(--glass);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .filter-btn:not(.active):hover {
            background: var(--primary-gradient);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass);
            border-radius: 20px;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .video-count {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-music me-2"></i>Mi Playlist
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="hero-section text-center">
            <h1 class="display-4 fw-bold mb-3">Tu Música, Tu Estilo</h1>
            <p class="lead mb-4">Crea la playlist perfecta con tus videos favoritos de YouTube</p>
            <div class="row justify-content-center mb-4">
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stat-number" id="totalVideos">0</div>
                        <small>Total Videos</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stat-number" id="totalLikes">0</div>
                        <small>Total Likes</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stat-number" id="totalFavorites">0</div>
                        <small>Favoritos</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-card">
            <h4 class="mb-4"><i class="fas fa-plus-circle me-2"></i>Agregar Nuevo Video</h4>
            <form id="agregarForm">
                <div class="row g-3">
                    <div class="col-md-5">
                        <input type="text" class="form-control form-control-lg" name="nombre" 
                               placeholder="🎵 Nombre del video" required
                               style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass); color: white;">
                    </div>
                    <div class="col-md-5">
                        <input type="url" class="form-control form-control-lg" name="link" 
                               placeholder="🔗 URL de YouTube" required
                               style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass); color: white;">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-glow w-100">
                            <i class="fas fa-plus me-2"></i>Agregar
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="filter-container">
            <button class="filter-btn btn-glow active" data-filter="all">
                <i class="fas fa-list me-2"></i> Todos los videos
            </button>
            <button class="filter-btn btn-glow" data-filter="favorites">
                <i class="fas fa-star me-2"></i> Solo favoritos
            </button>
        </div>

        <div id="videosContainer" class="row">
            <div class="col-12 text-center">
                <div class="p-5">
                    <div class="loading mx-auto mb-3"></div>
                    <p class="text-muted">Cargando tu música...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        cargarVideos();
        
        // Agregar event listeners para los filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remover clase active de todos los botones
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                // Agregar clase active al botón clickeado
                this.classList.add('active');
                
                // Filtrar videos
                const filter = this.getAttribute('data-filter');
                filtrarVideos(filter);
            });
        });
    });

    let allVideos = []; // Variable para almacenar todos los videos

    function showToast(message, type = 'info') {
        const toastContainer = document.querySelector('.toast-container');
        const toastId = 'toast-' + Date.now();
        
        const toastHTML = `
            <div id="${toastId}" class="toast align-items-center text-white bg-${type} border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="fas fa-${getToastIcon(type)} me-2"></i>${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        `;
        toastContainer.insertAdjacentHTML('beforeend', toastHTML);
        const toastElement = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastElement);
        toast.show();
        toastElement.addEventListener('hidden.bs.toast', () => toastElement.remove());
    }

    function getToastIcon(type) {
        const icons = {
            'success': 'check-circle',
            'danger': 'exclamation-triangle',
            'info': 'info-circle',
            'warning': 'exclamation-circle'
        };
        return icons[type] || 'info-circle';
    }

    async function cargarVideos() {
        try {
            const response = await fetch("playlist");
            const data = await response.json();

            allVideos = data; // Guardar todos los videos
            mostrarVideos(data);
            actualizarEstadisticas(data);

        } catch (error) {
            showToast('Error cargando videos del servidor', 'danger');
        } 
    }

    function mostrarVideos(videos) {
        const container = document.getElementById('videosContainer');
        
        if (!videos || videos.length === 0) {
            container.innerHTML = `
                <div class="col-12">
                    <div class="empty-state">
                        <i class="fas fa-music"></i>
                        <h5 class="text-muted">Tu playlist está vacía</h5>
                        <p class="text-muted">¡Agrega tu primer video para comenzar!</p>
                    </div>
                </div>
            `;
            return;
        }
        
        container.innerHTML = '';
        
        videos.forEach(video => {
            const embedUrl = obtenerEmbedUrl(video.link);
            const col = document.createElement('div');
            col.className = 'col-xl-4 col-lg-6 col-md-6';
            col.innerHTML = `
                <div class="video-card ${video.favorito ? 'favorito' : ''}">
                    <div class="embed-container">
                        <iframe src="${embedUrl}" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3">${video.nombre}</h5>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex gap-2">
                                <button class="btn btn-favorite btn-icon ${video.favorito ? 'pulse' : ''}" 
                                    onclick="toggleFavorito('${video.id}')">
                                    <i class="fas fa-star ${video.favorito ? 'text-warning' : 'text-white'}"></i>
                                </button>
                                <button class="btn btn-delete btn-icon" onclick="eliminarVideo('${video.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="badge bg-primary px-3 py-2">
                                    <i class="fas fa-heart me-1"></i> ${video.likes}
                                </span>
                                <button class="btn btn-like btn-icon" onclick="darLike('${video.id}')">
                                    <i class="fas fa-thumbs-up"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
        
        // Mostrar contador de videos
        const videoCount = document.createElement('div');
        videoCount.className = 'col-12 text-center video-count';
        videoCount.textContent = `Mostrando ${videos.length} de ${allVideos.length} videos`;
        container.appendChild(videoCount);
    }

    function filtrarVideos(filter) {
        let videosFiltrados = [];
        
        if (filter === 'all') {
            videosFiltrados = allVideos;
        } else if (filter === 'favorites') {
            videosFiltrados = allVideos.filter(video => video.favorito);
        }
        
        mostrarVideos(videosFiltrados);
    }

    function actualizarEstadisticas(videos) {
        document.getElementById('totalVideos').textContent = videos.length;
        document.getElementById('totalLikes').textContent = videos.reduce((a, v) => a + v.likes, 0);
        document.getElementById('totalFavorites').textContent = videos.filter(v => v.favorito).length;
    }

    function obtenerEmbedUrl(link) {
        if (!link) return '';
        
        if (link.includes('youtube.com/watch?v=')) {
            const videoId = link.split('v=')[1].split('&')[0];
            return 'https://www.youtube.com/embed/' + videoId;
        } else if (link.includes('youtu.be/')) {
            const videoId = link.split('youtu.be/')[1].split('?')[0];
            return 'https://www.youtube.com/embed/' + videoId;
        }
        return link;
    }

    document.getElementById('agregarForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const nombre = this.nombre.value;
        const link = this.link.value;

        try {
            const response = await fetch(`playlist?action=agregar&nombre=${encodeURIComponent(nombre)}&link=${encodeURIComponent(link)}`, {
                method: "POST"
            });

            const result = await response.json();
            if (result.success) {
                showToast("Video agregado!", "success");
                cargarVideos();
                this.reset();
            } else {
                showToast("Error: " + result.message, "danger");
            }
        } catch (error) {
            showToast("Error agregando video", "danger");
        }
    });

    async function eliminarVideo(id) {
        if (!confirm("¿Seguro que querés eliminarlo?")) return;

        try {
            const response = await fetch(`playlist?action=eliminar&id=${id}`, {
                method: "POST"
            });

            const result = await response.json();
            if (result.success) {
                showToast("Video eliminado", "info");
                cargarVideos();
            } else {
                showToast("Error: " + result.message, "danger");
            }
        } catch (error) {
            showToast("Error eliminando video", "danger");
        }
    }

    async function darLike(id) {
        try {
            const response = await fetch(`playlist?action=like&id=${id}`, {
                method: "POST"
            });

            const result = await response.json();
            if (result.success) {
                cargarVideos();
            } else {
                showToast("Error: " + result.message, "danger");
            }
        } catch (error) {
            showToast("Error al dar like", "danger");
        }
    }

    async function toggleFavorito(id) {
        try {
            const response = await fetch(`playlist?action=favorito&id=${id}`, {
                method: "POST"
            });

            const result = await response.json();
            if (result.success) {
                cargarVideos();
            } else {
                showToast("Error: " + result.message, "danger");
            }
        } catch (error) {
            showToast("Error al marcar favorito", "danger");
        }
    }
    </script> 
</body>
</html>
